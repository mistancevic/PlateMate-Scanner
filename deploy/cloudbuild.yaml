steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_IMAGE}
      - --build-arg=VITE_FIREBASE_API_KEY=${_FB_API_KEY}
      - --build-arg=VITE_FIREBASE_AUTH_DOMAIN=${_FB_AUTH_DOMAIN}
      - --build-arg=VITE_FIREBASE_PROJECT_ID=${_FB_PROJECT_ID}
      - --build-arg=VITE_FIREBASE_APP_ID=${_FB_APP_ID}
      - --build-arg=VITE_FIREBASE_DB_ID=${_FB_DB_ID}
      - --build-arg=VITE_COMMIT=${_COMMIT}
      - .
images:
  - ${_IMAGE}
# B140 (12 November 2026): Google stopped storing build logs in its default log bucket and failed every build. The log goes to
# Cloud Logging only: read it in the Google Cloud console, Cloud Build, History.
options:
  logging: CLOUD_LOGGING_ONLY
