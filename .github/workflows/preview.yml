# The preview, from GitHub (Coach Milan 3 November 2026, 09:19: Cloud Shell's weekly hours were used up and the Chromebook is
# away). The same ./deploy/preview.sh as in Cloud Shell, run as the github-deploy account, on main only.
# On a phone: GitHub, the repo, Actions, Preview, Run workflow. Promote is its own workflow, a separate step.
# The one secret: GCP_SA_KEY, the github-deploy account's key. deploy.env comes from deploy/ci-env.sh.
name: Preview
on:
  workflow_dispatch: {}
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Settings from the project
        env:
          FB_API_KEY_SECRET: ${{ secrets.FB_API_KEY }}
          FB_APP_ID_SECRET: ${{ secrets.FB_APP_ID }}
        run: ./deploy/ci-env.sh
      - name: Preview
        run: ./deploy/preview.sh
