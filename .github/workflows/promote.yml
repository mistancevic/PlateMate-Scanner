# Promote, from GitHub (Coach Milan 3 November 2026): the preview becomes what everyone gets on chefmealan.com, as
# ./deploy/promote.sh does in Cloud Shell. Run it only after the preview looks right. The log names the revision that served
# before it ("Before it"); going back from GitHub is not set up yet, Cloud Shell's ./deploy/rollback.sh or the Cloud Run
# console (Revisions, Manage traffic) does it.
name: Promote
on:
  workflow_dispatch: {}
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # GitHub signs in to Google Cloud with a short-lived token, no key (keys are blocked by the organization's policy)
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/384791096823/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@project-fb3c5fab-00d1-4d11-ac7.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Settings from the project
        env:
          FB_API_KEY_SECRET: ${{ secrets.FB_API_KEY }}
          FB_APP_ID_SECRET: ${{ secrets.FB_APP_ID }}
        run: ./deploy/ci-env.sh
      - name: Promote
        run: ./deploy/promote.sh
